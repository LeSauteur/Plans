<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>План продаж 2026</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --line: #d0d5dd;
      --head: #14532d;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --yellow-bg: #fef3c7;
      --red-bg: #fee2e2;
      --blue: #2563eb;
      --dark: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
    }

    .page { max-width: 2200px; margin: 0 auto; }

    .hero {
      background: linear-gradient(135deg, #0f172a, #166534);
      color: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .16);
    }

    h1 { margin: 0; font-size: 30px; }
    h2, h3 { margin: 0 0 10px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: var(--head);
      border: 1px solid var(--line);
    }

    button.active { background: var(--blue); color: white; border-color: var(--blue); }
    button.print { background: var(--dark); color: white; border-color: var(--dark); }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, .06);
    }

    .kpi-title { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .kpi-value { font-size: 23px; font-weight: 800; }

    .report {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, .08);
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
    }

    .report-box {
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 12px;
      background: #f8fafc;
    }

    .report-box ul { margin: 8px 0 0; padding-left: 18px; }
    .report-box li { margin-bottom: 5px; }

    .table-wrap {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--line);
      overflow: auto;
      box-shadow: 0 8px 22px rgba(15, 23, 42, .08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 2600px;
      background: white;
    }

    th, td {
      padding: 8px 9px;
      border: 1px solid #d7dce3;
      text-align: right;
      font-size: 12px;
      white-space: nowrap;
    }

    th {
      background: var(--head);
      color: white;
      position: sticky;
      top: 0;
      z-index: 1;
      text-align: center;
      vertical-align: middle;
    }

    tbody tr:nth-child(even) { background: #f9fafb; }
    tbody tr:hover { background: #eef6ff; }
    td.left, th.left { text-align: left; }
    td.center { text-align: center; }
    .owner { font-weight: 800; color: #101828; }
    .office { color: #344054; max-width: 320px; white-space: normal; line-height: 1.25; }
    .plan { background: #f2f4f7; font-weight: 700; }
    .pending { background: var(--yellow-bg) !important; color: #713f12; font-weight: 800; }
    .total { font-weight: 800; background: #f8fafc; }
    .ok { background: var(--green-bg) !important; color: #14532d; font-weight: 800; }
    .warn { background: var(--yellow-bg) !important; color: #713f12; font-weight: 800; }
    .bad { background: #ffedd5 !important; color: #7c2d12; font-weight: 800; }
    .danger { background: var(--red-bg) !important; color: #7f1d1d; font-weight: 800; }
    tfoot td { background: #111827; color: white; font-weight: 800; }

    body.view-q1 .q2, body.view-q1 .q3, body.view-q1 .q4, body.view-q1 .year { display: none; }
    body.view-q2 .q1, body.view-q2 .q3, body.view-q2 .q4, body.view-q2 .year { display: none; }
    body.view-q3 .q1, body.view-q3 .q2, body.view-q3 .q4, body.view-q3 .year { display: none; }
    body.view-q4 .q1, body.view-q4 .q2, body.view-q4 .q3, body.view-q4 .year { display: none; }
    body.view-year .q1, body.view-year .q2, body.view-year .q3, body.view-year .q4 { display: none; }

    body.view-q1 table, body.view-q2 table, body.view-q3 table, body.view-q4 table { min-width: 1250px; }
    body.view-year table { min-width: 950px; }

    @media print {
      body { background: white; padding: 0; }
      .hero { box-shadow: none; border-radius: 0; padding: 10px 0; background: white; color: black; }
      .actions { display: none !important; }
      .kpi-grid, .report { page-break-inside: avoid; }
      .table-wrap { box-shadow: none; border: 0; overflow: visible; }
      table { min-width: 0 !important; width: 100%; }
      th, td { padding: 3px 4px; font-size: 7px; }
      .office { max-width: 120px; }
      @page { size: A3 landscape; margin: 7mm; }
    }
  </style>
</head>

    const money2 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let rows = [];

    function formatNumber(value) { return money.format(Math.round(Number(value || 0))); }
    function hasPlan(value) { return Number.isFinite(Number(value)) && Number(value) > 0; }
    function quarterPlan(row, field) {
      return Object.prototype.hasOwnProperty.call(row, field) ? row[field] : row.plan;
    }
    function formatPlan(value) { return hasPlan(value) ? formatNumber(value) : "Не установлен"; }
    function percent(actual, plan) { return hasPlan(plan) ? Number(actual || 0) / Number(plan) * 100 : null; }
    function formatPercent(value) { return Number.isFinite(value) ? `${money2.format(value)}%` : "—"; }

    function percentClass(value) {
      if (!Number.isFinite(value)) return "pending";
      if (value >= 100) return "ok";
      if (value >= 80) return "warn";
      if (value >= 60) return "bad";
      return "danger";
    }

      const q2Plan = quarterPlan(row, "q2Plan");

      const q3Total = row.jul + row.aug + row.sep;
      const q4Total = row.oct + row.nov + row.dec;
      const yearPlan = [q1Plan, q2Plan, q3Plan, q4Plan]
        .filter(hasPlan)
        .reduce((sum, value) => sum + Number(value), 0);
      const yearTotal = q1Total + q2Total + q3Total + q4Total;

      return {
        ...row,
        q1Plan,
        q2Plan,
        q3Plan,
        q4Plan,
        q1Total,
        q2Total,
        q3Total,
        q4Total,
        q1Percent: percent(q1Total, q1Plan),
        q2Percent: percent(q2Total, q2Plan),
        q3Percent: percent(q3Total, q3Plan),
        q4Percent: percent(q4Total, q4Plan),
        yearPlan,
        yearTotal,
        yearPercent: percent(yearTotal, yearPlan),
        q2Left: hasPlan(q2Plan) ? Math.max(0, q2Plan - q2Total) : 0,
        q2Over: hasPlan(q2Plan) ? Math.max(0, q2Total - q2Plan) : 0,
        q3Left: hasPlan(q3Plan) ? Math.max(0, q3Plan - q3Total) : 0,
        q3Over: hasPlan(q3Plan) ? Math.max(0, q3Total - q3Plan) : 0
      };
    }

    function sum(field) { return rows.reduce((s, r) => s + Number(r[field] || 0), 0); }

    function renderKpi() {
      const plan = sum("q3Plan");
      const q1 = sum("q1Total");
      const q2 = sum("q2Total");
      const q3 = sum("q3Total");
      const q4 = sum("q4Total");
      const yearPlan = sum("yearPlan");
      const yearTotal = sum("yearTotal");

      document.getElementById("kpiGrid").innerHTML = `
        <div class="kpi-card"><div class="kpi-title">Подтверждённый план III квартала</div><div class="kpi-value">${formatNumber(plan)} ₽</div></div>
        <div class="kpi-card"><div class="kpi-title">1 квартал</div><div class="kpi-value">${formatNumber(q1)} ₽</div></div>
        <div class="kpi-card"><div class="kpi-title">2 квартал</div><div class="kpi-value">${formatNumber(q2)} ₽</div></div>
        <div class="kpi-card"><div class="kpi-title">3 квартал</div><div class="kpi-value">${formatNumber(q3)} ₽</div></div>
        <div class="kpi-card"><div class="kpi-title">4 квартал</div><div class="kpi-value">${formatNumber(q4)} ₽</div></div>
        <div class="kpi-card"><div class="kpi-title">Год</div><div class="kpi-value">${formatNumber(yearTotal)} ₽</div></div>
      `;
    }

    function renderReport() {
      const withPlan = rows.filter(r => hasPlan(r.q3Plan));
      const missingPlan = rows.filter(r => !hasPlan(r.q3Plan));
      const closed = withPlan.filter(r => r.q3Total >= r.q3Plan).sort((a, b) => b.q3Percent - a.q3Percent);
      const inProgress = withPlan.filter(r => r.q3Total < r.q3Plan).sort((a, b) => b.q3Percent - a.q3Percent);
      const left = withPlan.reduce((sum, r) => sum + r.q3Left, 0);

      const progressList = inProgress
        .map(r => `<li><strong>${r.name}</strong>: июль ${formatNumber(r.jul)} ₽ · ${formatPercent(r.q3Percent)} · осталось ${formatNumber(r.q3Left)} ₽</li>`)
        .join("");
      const closedList = closed
        .map(r => `<li><strong>${r.name}</strong>: июль ${formatNumber(r.jul)} ₽ · ${formatPercent(r.q3Percent)}</li>`)
        .join("");
      const missingList = missingPlan
        .map(r => `<li><strong>${r.name}</strong>: ${r.q3PlanNote || "требуется установить план"}</li>`)
        .join("");

      document.getElementById("report").innerHTML = `
        <h2>Выполнение плана III квартала после июля</h2>
        <div class="report-grid">
          <div class="report-box">
            <h3>В процессе: ${inProgress.length}</h3>
            <p>Осталось до подтверждённых квартальных планов: <strong>${formatNumber(left)} ₽</strong></p>
            <ul>${progressList}</ul>
          </div>
          <div class="report-box">
            <h3>План уже выполнен: ${closed.length}</h3>
            <ul>${closedList || "<li>Пока нет</li>"}</ul>
          </div>
          <div class="report-box">
            <h3>План не установлен: ${missingPlan.length}</h3>
            <ul>${missingList || "<li>Нет</li>"}</ul>
          </div>
        </div>
      `;
    }

    function renderTable() {
      const tbody = document.querySelector("#salesTable tbody");
      const tfoot = document.querySelector("#salesTable tfoot");
      tbody.innerHTML = "";

      rows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="center">${r.id}</td>
          <td class="left owner">${r.name}</td>
          <td class="left office">${r.offices}</td>
          <td class="q1 plan ${hasPlan(r.q1Plan) ? "" : "pending"}">${formatPlan(r.q1Plan)}</td><td class="q1">${formatNumber(r.jan)}</td><td class="q1">${formatNumber(r.feb)}</td><td class="q1">${formatNumber(r.mar)}</td><td class="q1 total">${formatNumber(r.q1Total)}</td><td class="q1 ${percentClass(r.q1Percent)}">${formatPercent(r.q1Percent)}</td>
          <td class="q2 plan ${hasPlan(r.q2Plan) ? "" : "pending"}">${formatPlan(r.q2Plan)}</td><td class="q2">${formatNumber(r.apr)}</td><td class="q2">${formatNumber(r.may)}</td><td class="q2">${formatNumber(r.jun)}</td><td class="q2 total">${formatNumber(r.q2Total)}</td><td class="q2 ${percentClass(r.q2Percent)}">${formatPercent(r.q2Percent)}</td>
          <td class="q3 plan ${hasPlan(r.q3Plan) ? "" : "pending"}" title="${r.q3PlanNote || ""}">${formatPlan(r.q3Plan)}</td><td class="q3">${formatNumber(r.jul)}</td><td class="q3">${formatNumber(r.aug)}</td><td class="q3">${formatNumber(r.sep)}</td><td class="q3 total">${formatNumber(r.q3Total)}</td><td class="q3 ${percentClass(r.q3Percent)}">${formatPercent(r.q3Percent)}</td>
          <td class="q4 plan ${hasPlan(r.q4Plan) ? "" : "pending"}">${formatPlan(r.q4Plan)}</td><td class="q4">${formatNumber(r.oct)}</td><td class="q4">${formatNumber(r.nov)}</td><td class="q4">${formatNumber(r.dec)}</td><td class="q4 total">${formatNumber(r.q4Total)}</td><td class="q4 ${percentClass(r.q4Percent)}">${formatPercent(r.q4Percent)}</td>
          <td class="year plan">${formatNumber(r.yearPlan)}</td><td class="year total">${formatNumber(r.yearTotal)}</td><td class="year ${percentClass(r.yearPercent)}">${formatPercent(r.yearPercent)}</td>
        `;
        tbody.appendChild(tr);
      });

      const totals = {
        q1Plan: sum("q1Plan"), q2Plan: sum("q2Plan"), q3Plan: sum("q3Plan"), q4Plan: sum("q4Plan"),
        jan: sum("jan"), feb: sum("feb"), mar: sum("mar"), q1Total: sum("q1Total"),
        apr: sum("apr"), may: sum("may"), jun: sum("jun"), q2Total: sum("q2Total"),
        jul: sum("jul"), aug: sum("aug"), sep: sum("sep"), q3Total: sum("q3Total"),
        oct: sum("oct"), nov: sum("nov"), dec: sum("dec"), q4Total: sum("q4Total"),
        yearPlan: sum("yearPlan"), yearTotal: sum("yearTotal")
      };

      const q1Percent = percent(totals.q1Total, totals.q1Plan);
      const q2Percent = percent(totals.q2Total, totals.q2Plan);
      const q3Percent = percent(totals.q3Total, totals.q3Plan);
      const q4Percent = percent(totals.q4Total, totals.q4Plan);
      const yearPercent = percent(totals.yearTotal, totals.yearPlan);

      tfoot.innerHTML = `
        <tr>
          <td colspan="3" class="left">ИТОГО</td>
          <td class="q1">${formatNumber(totals.q1Plan)}</td><td class="q1">${formatNumber(totals.jan)}</td><td class="q1">${formatNumber(totals.feb)}</td><td class="q1">${formatNumber(totals.mar)}</td><td class="q1">${formatNumber(totals.q1Total)}</td><td class="q1">${formatPercent(q1Percent)}</td>
          <td class="q2">${formatNumber(totals.q2Plan)}</td><td class="q2">${formatNumber(totals.apr)}</td><td class="q2">${formatNumber(totals.may)}</td><td class="q2">${formatNumber(totals.jun)}</td><td class="q2">${formatNumber(totals.q2Total)}</td><td class="q2">${formatPercent(q2Percent)}</td>
          <td class="q3">${formatNumber(totals.q3Plan)}</td><td class="q3">${formatNumber(totals.jul)}</td><td class="q3">${formatNumber(totals.aug)}</td><td class="q3">${formatNumber(totals.sep)}</td><td class="q3">${formatNumber(totals.q3Total)}</td><td class="q3">${formatPercent(q3Percent)}</td>
          <td class="q4">${formatNumber(totals.q4Plan)}</td><td class="q4">${formatNumber(totals.oct)}</td><td class="q4">${formatNumber(totals.nov)}</td><td class="q4">${formatNumber(totals.dec)}</td><td class="q4">${formatNumber(totals.q4Total)}</td><td class="q4">${formatPercent(q4Percent)}</td>
          <td class="year">${formatNumber(totals.yearPlan)}</td><td class="year">${formatNumber(totals.yearTotal)}</td><td class="year">${formatPercent(yearPercent)}</td>
        </tr>
      `;
    }

    function setView(view) {
      document.body.className = `view-${view}`;
      document.querySelectorAll(".actions button").forEach(btn => btn.classList.remove("active"));
      const button = document.getElementById(`btn-${view}`);
      if (button) button.classList.add("active");
    }

    document.addEventListener("DOMContentLoaded", () => {
      rows = owners.map(enrich);
      renderKpi();
      renderReport();
      renderTable();
    });
  </script>
</body>
</html>
